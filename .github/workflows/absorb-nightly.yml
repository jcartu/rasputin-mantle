name: Absorb Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  absorb-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync

      - name: Run mantle-absorb scan
        run: |
          uv run python -m gateway.absorb --output-dir outputs/absorb --max-repos 50

      - name: Upload capability delta
        uses: actions/upload-artifact@v4
        with:
          name: capability-delta
          path: outputs/absorb/CAPABILITY_DELTA.md
          retention-days: 30
