name: Absorb Nightly

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

jobs:
  absorb-nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install kernel dependencies
        run: |
          cd kernel
          pip install -e ".[dev]"

      - name: Run bakeoff (no external)
        run: |
          cd kernel
          python -m rasputin_omnitool bakeoff --output-dir outputs/rasputin-omnitool --no-external
        continue-on-error: true

      - name: Write capability delta placeholder
        run: |
          cat > CAPABILITY_DELTA.md << 'EOF'
          # Capability Delta — Auto-generated
          > Generated by absorb-nightly workflow

          ## Summary
          No new capabilities detected this run.

          ## Notes
          This is a Phase 0 stub. Phase 7 will wire the full absorb pipeline.
          EOF

      - name: Upload capability delta
        uses: actions/upload-artifact@v4
        with:
          name: capability-delta
          path: CAPABILITY_DELTA.md
