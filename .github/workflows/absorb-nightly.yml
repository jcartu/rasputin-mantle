name: absorb-nightly

on:
  schedule:
    - cron: "33 5 * * *"  # 05:33 UTC daily
  workflow_dispatch:

jobs:
  absorb:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: astral-sh/setup-uv@v3

      - name: Run mantle-absorb
        id: absorb
        run: |
          if [ ! -d submodules/omnitool ]; then
            echo "no omnitool submodule yet; skipping"
            echo "changed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd submodules/omnitool
          BEFORE=$(git rev-parse HEAD)
          git fetch origin main
          AFTER=$(git rev-parse origin/main)
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "omnitool unchanged"
            echo "changed=no" >> "$GITHUB_OUTPUT"
          else
            git checkout origin/main
            cd ../..
            echo "changed=yes" >> "$GITHUB_OUTPUT"
            echo "from=$BEFORE" >> "$GITHUB_OUTPUT"
            echo "to=$AFTER"     >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR
        if: steps.absorb.outputs.changed == 'yes'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "absorb omnitool ${{ steps.absorb.outputs.from }}..${{ steps.absorb.outputs.to }}"
          branch: absorb/omnitool-${{ github.run_number }}
          title: "Absorb omnitool changes ${{ steps.absorb.outputs.to }}"
          body: |
            Nightly omnitool absorb.

            **Upstream:** `${{ steps.absorb.outputs.from }}` → `${{ steps.absorb.outputs.to }}`

            Generated by the absorb-nightly workflow. Phase-verify and license-gate must pass before merging.
