name: eval-nightly

on:
  schedule:
    - cron: "17 4 * * *"  # 04:17 UTC daily
  workflow_dispatch:

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - uses: astral-sh/setup-uv@v3

      - uses: pnpm/action-setup@v4
        with: { version: 9 }

      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: pnpm }

      - run: sudo apt-get update -qq && sudo apt-get install -y jq

      - name: Install deps
        run: |
          uv sync
          pnpm install --frozen-lockfile || pnpm install

      - name: Bring up support services
        run: docker compose -f infra/compose.dev.yml up -d --wait

      - name: Run evals
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MANTLE_GATEWAY_URL: http://127.0.0.1:8000
        run: |
          mkdir -p outputs
          make eval-codeact      || true
          make eval-webvoyager   || true
          make eval-gaia         || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_number }}
          path: outputs/

      - name: Post summary
        if: always()
        run: |
          for f in outputs/codeact-eval.json outputs/webvoyager-100.json outputs/gaia-mini.json; do
            if [ -f "$f" ]; then
              echo "## $(basename $f .json)" >> $GITHUB_STEP_SUMMARY
              jq -r '"pass_rate: \(.pass_rate)  (\(.passed)/\(.total))"' "$f" >> $GITHUB_STEP_SUMMARY
            fi
          done
