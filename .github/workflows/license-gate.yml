name: license-gate

on:
  pull_request:
    paths:
      - "**/pyproject.toml"
      - "**/uv.lock"
      - "**/package.json"
      - "**/pnpm-lock.yaml"
      - "**/Cargo.toml"
      - "**/Cargo.lock"

jobs:
  license-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3

      - name: Detect dependency diff
        id: deps
        run: |
          git fetch origin ${{ github.base_ref }}
          if git diff origin/${{ github.base_ref }}...HEAD --name-only | \
               grep -qE '(pyproject\.toml|uv\.lock|package\.json|pnpm-lock\.yaml|Cargo\.toml|Cargo\.lock)$'; then
            echo "changed=yes" >> "$GITHUB_OUTPUT"
          else
            echo "changed=no" >> "$GITHUB_OUTPUT"
          fi

      - name: rasputin_omnitool license-review
        if: steps.deps.outputs.changed == 'yes'
        run: |
          if [ -d submodules/omnitool ]; then
            cd submodules/omnitool && pip install -e . && cd ../..
          else
            pip install rasputin-omnitool || true
          fi
          rasputin_omnitool license-review --base origin/${{ github.base_ref }} --head HEAD \
            --policy .github/license-policy.yaml \
            --fail-on copyleft,unknown
