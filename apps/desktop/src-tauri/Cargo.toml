[package]
name = "rasputin-mantle-desktop"
version = "1.3.0"
description = "Rasputin Mantle desktop shell"
authors = ["Rasputin Mantle"]
license = "MIT"
edition = "2021"

[lib]
name = "rasputin_mantle_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
