tasks:
  - id: slides-01
    format: slides
    prompt: Create a project kickoff presentation for a new product launch. Address strategic goals, team alignment, timeline, dependencies, and risk assessment for executive and cross-functional stakeholders.
    expected: {file: slides.pptx, min_slides: 5}
  - id: slides-02
    format: slides
    prompt: Create a quarterly business review presentation for senior stakeholders. Summarize performance, market context, operational learnings, customer signals, and priorities for the next quarter.
    expected: {file: slides.pptx, min_slides: 5}
  - id: slides-03
    format: slides
    prompt: Create an investor pitch deck for an early-stage AI productivity company. Make the case for the opportunity, product differentiation, traction, business model, and fundraising ask.
    expected: {file: slides.pptx, min_slides: 6}
  - id: slides-04
    format: slides
    prompt: Create a research findings presentation about enterprise teams adopting autonomous agents. Explain the research approach, major insights, supporting evidence, implications, and recommended next steps.
    expected: {file: slides.pptx, min_slides: 5}
  - id: slides-05
    format: slides
    prompt: Create a board update presentation for a rapidly scaling software company. Cover business health, execution progress, financial posture, open decisions, and risks requiring board attention.
    expected: {file: slides.pptx, min_slides: 5}
  - id: slides-06
    format: slides
    prompt: Create an onboarding training presentation for new operations hires who will use an internal automation platform. Teach the audience the operating model, workflows, review standards, escalation paths, and knowledge checks.
    expected: {file: slides.pptx, min_slides: 5}
  - id: slides-07
    format: slides
    prompt: Create a sales enablement presentation for account executives selling a technical product to enterprise operations leaders. Include buyer context, positioning, proof points, discovery guidance, and objection handling.
    expected: {file: slides.pptx, min_slides: 5}
  - id: slides-08
    format: slides
    prompt: Create a technical architecture review presentation for a secure agent execution platform. Explain the system at a level useful to engineering leaders, including components, data movement, trust boundaries, operational controls, and future scaling concerns.
    expected: {file: slides.pptx, min_slides: 5}
  - id: slides-09
    format: slides
    prompt: Create a go-to-market launch plan presentation for a productivity benchmark release. Cover target audiences, messaging, channel strategy, launch milestones, success metrics, and contingency planning.
    expected: {file: slides.pptx, min_slides: 6}
  - id: slides-10
    format: slides
    prompt: Create an executive strategy presentation for the next year of an autonomous work platform. Discuss market shifts, strategic bets, operating principles, investment tradeoffs, measurement approach, and leadership decisions needed.
    expected: {file: slides.pptx, min_slides: 6}
  - id: sheet-01
    format: spreadsheet
    prompt: Build a sales pipeline workbook that helps a revenue team understand funnel health, stage conversion, deal ownership, next actions, and forecast risk.
    expected: {file: data.xlsx, min_sheets: 2}
  - id: sheet-02
    format: spreadsheet
    prompt: Build a five-year financial model workbook for a growing SaaS business. Include assumptions and connected financial statements that can be reviewed by finance leadership.
    expected: {file: data.xlsx, min_sheets: 4, formulas: true}
  - id: sheet-03
    format: spreadsheet
    prompt: Build a feature comparison workbook to evaluate competing productivity platforms for an enterprise buyer. Make it useful for comparing tradeoffs across product, security, usability, and cost dimensions.
    expected: {file: data.xlsx, min_sheets: 1}
  - id: sheet-04
    format: spreadsheet
    prompt: Build a customer data cleaning workbook from a messy customer export. Deduplicate repeated records, normalize spend values, preserve useful fields, and summarize the cleaned dataset.
    expected: {file: data.xlsx, min_sheets: 2}
  - id: sheet-05
    format: spreadsheet
    prompt: Build an expense tracker workbook for a small AI infrastructure team. Track categories, vendors, recurring costs, monthly totals, variance, and a visual summary for budget review.
    expected: {file: data.xlsx, min_sheets: 2}
  - id: sheet-06
    format: spreadsheet
    prompt: Build a hiring pipeline workbook for a team scaling engineering, design, and operations roles. Track funnel stages, ownership, candidate status, bottlenecks, and recruiting priorities.
    expected: {file: data.xlsx, min_sheets: 2}
  - id: sheet-07
    format: spreadsheet
    prompt: Build a vendor scoring workbook for selecting a secure infrastructure provider. Compare options across cost, compliance, support, reliability, implementation effort, and total weighted score.
    expected: {file: data.xlsx, min_sheets: 1}
  - id: sheet-08
    format: spreadsheet
    prompt: Build a product metrics workbook for an executive product review. Track activation, retention, engagement, quality, customer outcomes, trends, and interpretation notes.
    expected: {file: data.xlsx, min_sheets: 2}
  - id: sheet-09
    format: spreadsheet
    prompt: Build a lightweight annual budget workbook for an autonomous-agent evaluation program. Include monthly planning, actuals, variance analysis, and a chart-friendly summary.
    expected: {file: data.xlsx, min_sheets: 2, formulas: true}
  - id: sheet-10
    format: spreadsheet
    prompt: Build an operational status workbook that can filter a cross-functional initiative list by health, owner, priority, and next review date while preserving an executive summary of at-risk work.
    expected: {file: data.xlsx, min_sheets: 2}
  - id: doc-01
    format: document
    prompt: Write a business memo recommending whether leadership should approve a phased rollout of an internal automation platform. Address background, rationale, risks, mitigations, and a clear decision request.
    expected: {files: [output.docx, output.pdf]}
  - id: doc-02
    format: document
    prompt: Write an academic-style mini report about the effects of AI assistants on knowledge worker productivity. Include a concise abstract, method summary, findings, limitations, and conclusion.
    expected: {file: output.docx}
  - id: doc-03
    format: document
    prompt: Write a client proposal as a polished PDF for a four-week pilot implementing secure agent workflows. Explain scope, deliverables, timeline, responsibilities, pricing approach, and acceptance criteria.
    expected: {file: output.pdf}
  - id: doc-04
    format: document
    prompt: Write a comprehensive operating guide with a table of contents for teams running autonomous productivity evaluations. Cover setup, task selection, execution, review, troubleshooting, governance, and reporting.
    expected: {file: output.docx}
  - id: doc-05
    format: document
    prompt: Write a launch checklist document for releasing a new benchmark suite. Organize the work from preparation through launch day and post-launch follow-up, including quality, communications, monitoring, and rollback considerations.
    expected: {files: [output.docx, output.pdf]}
  - id: doc-06
    format: document
    prompt: "Write a meeting recap document from these notes: the team agreed to ship the next productivity benchmark iteration this week, remove pre-supplied outlines, verify generated artifacts structurally, and assign owners for runner updates, skill behavior, QA, and release communication."
    expected: {file: output.docx}
  - id: doc-07
    format: document
    prompt: Write an incident report for a benchmark run that passed structurally but failed quality review because tasks contained too much pre-supplied content. Explain impact, root cause, detection, corrective actions, and prevention.
    expected: {file: output.pdf}
  - id: doc-08
    format: document
    prompt: Write a research brief about what makes productivity agents useful in real business workflows. Discuss the central question, evidence themes, practical interpretation, caveats, and recommended evaluation criteria.
    expected: {files: [output.docx, output.pdf]}
  - id: doc-09
    format: document
    prompt: Write a standard operating procedure for reviewing generated productivity artifacts before publication. Include purpose, scope, roles, procedure, acceptance checks, records, and escalation rules.
    expected: {file: output.docx}
  - id: doc-10
    format: document
    prompt: Write an executive summary PDF explaining why the productivity benchmark is being updated to require agents to generate their own outlines. Summarize the problem, change, expected benefits, risks, and next steps.
    expected: {file: output.pdf}
