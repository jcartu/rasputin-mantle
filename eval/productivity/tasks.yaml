        - Evidence: v1.3.1 aggregate pass rate was 66.7% but quality averaged only about 4.4 out of 10
        - Evidence: v1.3.2 bare prompts dropped to 6.67% aggregate with quality around 1.7 out of 10
        - Policy change: prompts will provide intent, audience, facts, deliverable type, template, and tone
        - Policy change: expected schema will contain only structural constraints and domains to address
        - Expected benefit: benchmark measures reasoning, synthesis, and artifact construction rather than outline copying
        - Risk: prompts with too few facts may understate agent ability
        - Mitigation: require concrete user-supplied facts while banning pre-written sections and bullet content
        - Next steps: rewrite tasks, rerun productivity benchmark, compare pass rate and quality to baselines

