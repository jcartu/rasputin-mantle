# eval/promptfoo/codeact.yaml
# Contract suite for CodeAct: every tool in the catalog must return its declared schema.
# Run via `make eval-codeact`. Writes outputs/codeact-eval.json with `pass_rate`.

description: "CodeAct catalog contract tests"

providers:
  - id: file:eval/promptfoo/codeact-provider.py
    label: codeact-local
    config:
      vllm_url: "${VLLM_BASE_URL}"
      vllm_key: "${VLLM_API_KEY}"

prompts:
  - "Use the {{tool}} tool to {{action}}. Return only the tool's output."

tests:
  - description: "fs.read returns content"
    vars:
      tool: fs.read
      action: "read /etc/hostname"
    assert:
      - type: contains
        value: "content"
      - type: javascript
        value: "JSON.parse(output).hasOwnProperty('content')"

  - description: "shell.exec returns stdout"
    vars:
      tool: shell.exec
      action: "run `echo hello`"
    assert:
      - type: contains
        value: "stdout"
      - type: javascript
        value: "JSON.parse(output).stdout.includes('hello')"

  - description: "browser.navigate returns url"
    vars:
      tool: browser.navigate
      action: "navigate to https://example.com"
    assert:
      - type: contains
        value: "url"

  - description: "search.web returns results array"
    vars:
      tool: search.web
      action: "search for 'rasputin omnitool'"
    assert:
      - type: javascript
        value: "Array.isArray(JSON.parse(output).results)"

  - description: "memory.recall returns matches"
    vars:
      tool: memory.recall
      action: "recall context about 'project plan'"
    assert:
      - type: contains
        value: "matches"
