<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rasputin Mantle Session</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; background: #09090b; color: #f4f4f5; }
      body { margin: 0; }
      main { display: grid; gap: 14px; padding: 18px; }
      .status { border: 1px solid #3f3f46; border-radius: 14px; padding: 14px; background: #18181b; }
      .events { display: grid; gap: 10px; }
      article { border-left: 3px solid #14b8a6; padding: 10px 12px; background: #111114; white-space: pre-wrap; overflow-wrap: anywhere; }
      .muted { color: #a1a1aa; }
    </style>
  </head>
  <body>
    <main>
      <h1>Current Session</h1>
      <section id="status" class="status muted">Connecting to Mantle gateway…</section>
      <section id="events" class="events" aria-live="polite"></section>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
