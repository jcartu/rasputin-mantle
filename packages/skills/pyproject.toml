[project]
name = "mantle-skills"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "pandas>=2.2,<3",
    "python-docx>=1.1,<2",
    "python-pptx>=1.0,<2",
    "pyyaml>=6.0,<7",
    "reportlab>=4.2,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
