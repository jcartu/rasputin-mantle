# Workspace root — not a buildable package

[tool.uv.workspace]
members = ["apps/gateway", "packages/sandbox", "packages/codeact", "packages/browser", "packages/skills"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
