# Workspace root — not a buildable package

[tool.uv.workspace]
members = ["apps/gateway", "packages/sandbox", "packages/codeact", "packages/wide-research", "packages/scheduler", "packages/browser", "packages/skills", "packages/shared", "packages/integrations/slack", "packages/integrations/email"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.uv.sources]
wide-research = { workspace = true }
scheduler = { workspace = true }
sandbox = { workspace = true }
mantle-codeact = { workspace = true }
mantle-skills = { workspace = true }
mantle-browser = { workspace = true }
mantle-shared = { workspace = true }
mantle-slack-integration = { workspace = true }
mantle-email-integration = { workspace = true }
